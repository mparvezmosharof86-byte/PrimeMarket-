name: Build PrimeMarket Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Direct APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrimeMarket.apk

      - name: Publish Direct APK (No ZIP)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "PrimeMarket Build #${{ github.run_number }}"
          body: "📲 **Direct APK Download (No ZIP Needed)**\n\nClick on PrimeMarket.apk below to download directly to your phone."
          files: build/app/outputs/flutter-apk/PrimeMarket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
