name: PrimeMarket Direct APK Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_primemarket:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.29.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Sync Android Wrapper & Gradle 8.11.1
        run: |
          flutter create . --org com.novastudio24 --project-name primemarket --platforms android
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip' >> android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Packages
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Prepare PrimeMarket APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PrimeMarket.apk

      - name: Publish Direct APK Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "PrimeMarket Build #${{ github.run_number }}"
          body: "Direct APK Download for PrimeMarket (No ZIP)."
          files: build/app/outputs/flutter-apk/PrimeMarket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
