name: primemarket
description: "PrimeMarket - Enterprise Global Dropshipping E-Commerce App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & CJ API
  dio: ^5.4.3+1
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Daraz/Amazon Style UI & Media
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  flutter_staggered_grid_view: ^0.7.0

  # Checkout & Official Stripe SDK
  webview_flutter: ^4.7.0
  flutter_stripe: ^11.0.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  fluttertoast: ^8.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
