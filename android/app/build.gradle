// PrimeMarket App Module Build Configuration
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def props = new Properties()
def propsFile = rootProject.file('local.properties')
if (propsFile.exists()) {
    propsFile.withReader('UTF-8') { reader ->
        props.load(reader)
    }
}

def appVersionCode = props.getProperty('flutter.versionCode') ?: '1'
def appVersionName = props.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.novastudio24.primemarket"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        applicationId "com.novastudio24.primemarket"
        minSdk 21
        targetSdk 36
        versionCode appVersionCode.toInteger()
        versionName appVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}

flutter {
    source '../..'
}
